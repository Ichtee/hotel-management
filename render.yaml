# Cấu hình API trên Render; các giá trị sync: false được nhập khi tạo Blueprint.
services:
  - type: web
    name: grandstay-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Có hai lớp proxy khi Vercel chuyển tiếp /api đến Render.
      - key: TRUST_PROXY
        value: "2"
      # Render tạo khóa một lần; giữ ổn định để dữ liệu và phiên cũ còn hợp lệ.
      - key: JWT_SECRET
        generateValue: true
      - key: GATEWAY_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      # Các giá trị cần nhập khi triển khai.
      # Chuỗi kết nối MongoDB Atlas.
      - key: MONGO_URI
        sync: false
      # Địa chỉ frontend trên Vercel, không có dấu gạch chéo cuối.
      - key: CLIENT_ORIGIN
        sync: false
      # Dùng cùng địa chỉ với CLIENT_ORIGIN.
      - key: PUBLIC_URL
        sync: false
      # Dùng CLIENT_ORIGIN để tạo liên kết trong email.
      - key: CLIENT_URL
        sync: false
      # Khóa Resend cho email xác minh, đặt lại mật khẩu và thông báo.
      - key: RESEND_API_KEY
        sync: false
      # Dùng địa chỉ thử nghiệm của Resend đến khi xác minh tên miền gửi.
      - key: RESEND_FROM_EMAIL
        sync: false
      # Khóa reCAPTCHA v2 dạng ô chọn; đăng ký tên miền Vercel tại Google.
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # Tự dùng SePay khi đã nhập đủ mã đơn vị và khóa bí mật.
      - key: SEPAY_MERCHANT_ID
        sync: false
      - key: SEPAY_SECRET_KEY
        sync: false
      # Dùng sandbox khi thử nghiệm, production khi thanh toán thật.
      - key: SEPAY_ENV
        value: sandbox
      # Khi chưa có khóa SePay, bật true để dùng cổng demo không chuyển tiền thật.
      - key: ENABLE_SANDBOX_GATEWAY
        value: "true"
